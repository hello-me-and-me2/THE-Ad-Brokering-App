<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — THE INTROductory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/profile-picture.png">
<link rel="stylesheet" href="assets/signin.css">
<script src="assets/users-data.js"></script>
</head>
<body>

<a class="admin-tab" href="admin-signin.html">ADMIN</a>

<div class="signin-wrap">
  <div class="signin-card">
    <span class="signin-logo">
      <img src="assets/profile-picture.png" alt="THE INTROductory" class="signin-logo-img">
    </span>

    <h1>Create your account</h1>
    <p class="signin-sub">Join THE INTROductory and start making deals.</p>

    <form id="signin-form" novalidate>
      <label class="field">
        Email
        <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </label>

      <label class="field">
        Username
        <input type="text" name="username" id="username-input" required placeholder="how people will find you" pattern="[a-zA-Z0-9_]{3,20}" autocomplete="username" autocapitalize="off" spellcheck="false">
      </label>
      <p class="field-error" id="username-error" hidden></p>

      <label class="field">
        Password
        <input type="password" name="password" required placeholder="Create a password" minlength="8" autocomplete="new-password">
      </label>

      <div class="role-select">
        <span class="role-label">I am a...</span>
        <div class="role-options">
          <label class="role-option">
            <input type="radio" name="role" value="business" checked>
            <span>Business</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="influencer">
            <span>Influencer</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit">Continue</button>
    </form>

  </div>
</div>

<script>
  document.getElementById('signin-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var usernameInput = document.getElementById('username-input');
    var usernameError = document.getElementById('username-error');
    var username = usernameInput.value.trim();

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      usernameError.textContent = 'Usernames are 3–20 characters: letters, numbers, and underscores only.';
      usernameError.hidden = false;
      usernameInput.focus();
      return;
    }

    if (tbaUsernameTaken(username)) {
      usernameError.textContent = 'That username is already taken — try another.';
      usernameError.hidden = false;
      usernameInput.focus();
      return;
    }

    usernameError.hidden = true;

    var role = document.querySelector('input[name="role"]:checked').value;

    localStorage.setItem('tba_authed', '1');
    localStorage.setItem('tba_username', username);
    localStorage.setItem('tba_role', role);
    window.location.href = 'home.html';
  });
</script>

</body>
</html>
