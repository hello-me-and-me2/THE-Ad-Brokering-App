<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>if(!localStorage.getItem("tba_authed")){location.replace("index.html");}if("scrollRestoration" in history){history.scrollRestoration="manual";}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — THE INTROductory</title>
<meta name="description" content="View and edit your THE INTROductory profile, network, and account activity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/profile-picture.png">
<link rel="stylesheet" href="assets/profile.css">
<script src="assets/users-data.js"></script>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="home.html">
      <span class="brand-lockup">
        <span class="brand-logo">
          <img src="assets/profile-picture.png" alt="THE INTROductory" class="brand-mark-img" width="256" height="256">
        </span>
        <span class="brand-tagline">your account</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="home.html">Home</a>
      <a href="messaging.html">Messaging &amp; Negotiation</a>
      <a href="network.html">The Network</a>
      <a href="about.html">About</a>
      <a href="profile.html" class="active">Profile</a>
      <div class="notif-wrap" id="notif-wrap">
        <button type="button" class="notif-bell-btn" id="notif-bell-btn" aria-label="Notifications"></button>
      </div>
      <button type="button" class="theme-toggle-btn" id="theme-toggle-btn"></button>
      <a href="index.html" class="nav-logout" id="logout-link">Log Out</a>
    </nav>
  </div>
</header>

<main>
  <div id="profile-content"></div>
</main>

<footer>
  &copy; 2026 THE INTROductory. Built with care by Andre Anderson &amp; team.<span id="egg-dot" aria-hidden="true">.</span>
  <span style="margin-left:10px;"><a href="terms.html" style="color:inherit;">Terms</a> &middot; <a href="privacy.html" style="color:inherit;">Privacy</a></span>
</footer>


<script>
  document.getElementById('logout-link').addEventListener('click', function () {
    localStorage.removeItem('tba_authed');
  });
  tbaWireThemeToggle('theme-toggle-btn', 'light');
  tbaWireNotificationBell('notif-wrap', 'notif-bell-btn');

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function normalizeUrl(url) {
    url = (url || '').trim();
    if (!url) return '';
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url;
  }

  function initials(name) {
    return name.replace('@', '').slice(0, 2).toUpperCase();
  }

  var params = new URLSearchParams(window.location.search);
  var requestedUsername = params.get('u');
  var myUsername = localStorage.getItem('tba_username');
  var viewUsername = requestedUsername || myUsername;

  // Recorded once per page load, not per render() — render() re-runs
  // after every save/submit, and this is a page view, not an edit.
  if (tbaGetUserByUsername(viewUsername)) tbaRecordProfileView(viewUsername);

  var content = document.getElementById('profile-content');
  var sentRequests = tbaGetSentRequests();

  function renderLinks(links) {
    if (!links || links.length === 0) {
      return '<p class="no-links">No links added yet.</p>';
    }
    return '<div class="profile-links">' + links.map(function (l) {
      var url = normalizeUrl(l.url);
      if (!url) return '';
      return '<a class="profile-link-pill" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(l.label || url) + '</a>';
    }).join('') + '</div>';
  }

  function avatarMarkup(user, cls) {
    return user.avatar
      ? '<img class="' + cls + '" src="' + user.avatar + '" alt="">'
      : '<div class="' + cls + '">' + initials(user.username) + '</div>';
  }

  function renderVerifySection(user, status) {
    if (user.verified) {
      return '<p class="verify-status" style="color:var(--olive);background:#eef1e6;">' +
        tbaVerifiedBadgeHtml() + ' Your account is verified.</p>';
    }
    if (status === 'pending') {
      return '<p class="verify-status pending">&#9203; Verification application pending review.</p>';
    }

    var deniedNote = status === 'denied'
      ? '<p class="verify-status denied">Your last application wasn\'t approved. You can apply again below.</p>'
      : '';

    return deniedNote +
      '<form class="verify-apply-form" id="verify-apply-form">' +
      '<label class="edit-field">Apply for a verified badge' +
      '<textarea id="verify-reason-input" maxlength="300" placeholder="Tell the team why your account should be verified..." required></textarea>' +
      '</label>' +
      '<button type="submit" class="btn-edit">Submit Application</button>' +
      '</form>';
  }

  function renderAccountSection(user) {
    var consented = tbaHasConsentedESign();
    return (
      '<div class="profile-account-section">' +
      '<h3>Account</h3>' +
      '<div class="esign-consent-row">' +
      '<div>' +
      '<p class="esign-consent-label">Consent to sign documents electronically</p>' +
      '<p class="esign-consent-status">' + (consented
        ? 'Given ' + tbaFormatDateLong(tbaGetESignConsentAcceptedAt())
        : 'Not given yet — you\'ll be asked next time you sign a contract.') + '</p>' +
      '</div>' +
      (consented
        ? '<button type="button" class="btn-edit" id="withdraw-esign-btn">Withdraw Consent</button>'
        : '') +
      '</div>' +
      '</div>'
    );
  }

  function renderNetworkSection(user) {
    var members = tbaGetNetworkFor(user.username);
    var isYou = !!user.isYou;

    var chips = members.length === 0
      ? '<p class="no-links">🌱 ' + (isYou ? 'Your network is empty. Close a deal or connect with someone in ' : 'This account hasn\'t connected with anyone in ') +
        '<a href="network.html">The Network</a> yet.</p>'
      : '<div class="network-chip-list">' + members.map(function (m) {
          var href = 'profile.html?u=' + encodeURIComponent(m.username);
          var avatarHtml = m.avatar
            ? '<img src="' + m.avatar + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
            : initials(m.username);
          return '<a class="network-chip" href="' + href + '">' +
            '<span class="network-chip-avatar">' + avatarHtml + '</span>' +
            '<span>' + escapeHtml(m.name) + (m.isYou ? ' (You)' : '') + '</span>' +
            (m.verified ? tbaVerifiedBadgeHtml() : '') +
            '</a>';
        }).join('') + '</div>';

    return (
      '<div class="profile-network-section">' +
      '<h3>Network <span class="network-count">(' + members.length + ')</span></h3>' +
      chips +
      '</div>'
    );
  }

  function renderActivitySection(user) {
    var activities = tbaGetActivityFor(user.username);

    var body = activities.length === 0
      ? '<p class="no-links">✨ Nothing to show yet — activity will show up here as deals, contracts, and connections happen.</p>'
      : '<ul class="activity-feed-list">' + activities.map(function (a) {
          var tag = a.link ? 'a' : 'div';
          var hrefAttr = a.link ? ' href="' + a.link + '"' : '';
          return '<li class="activity-feed-item">' +
            '<' + tag + ' class="activity-feed-link"' + hrefAttr + '>' +
            '<span class="activity-feed-icon">' + a.icon + '</span>' +
            '<span class="activity-feed-text">' + escapeHtml(a.text) +
            (a.date ? '<span class="activity-feed-date">' + tbaFormatDateLong(a.date) + '</span>' : '') +
            '</span>' +
            '</' + tag + '>' +
            '</li>';
        }).join('') + '</ul>';

    return (
      '<div class="profile-activity-section">' +
      '<h3>Recent Activity</h3>' +
      body +
      '</div>'
    );
  }

  function renderEditForm(user) {
    var rows = [];
    for (var i = 0; i < 7; i++) {
      var existing = user.links[i] || { label: '', url: '' };
      rows.push(
        '<div class="link-row">' +
        '<input type="text" class="link-label" placeholder="Label (e.g. Instagram)" value="' + escapeHtml(existing.label) + '">' +
        '<input type="url" class="link-url" placeholder="https://..." value="' + escapeHtml(existing.url) + '">' +
        '</div>'
      );
    }

    return (
      '<div class="profile-edit-form" id="edit-form" hidden>' +
      '<div class="edit-field">Profile Picture' +
      '<div class="avatar-edit-row">' +
      '<div id="avatar-preview-wrap">' + avatarMarkup(user, 'profile-avatar-lg') + '</div>' +
      '<div class="avatar-edit-actions">' +
      '<label class="btn-edit upload-label">Upload Photo<input type="file" id="photo-upload" accept="image/*" hidden></label>' +
      '<button type="button" class="btn-edit" id="camera-btn">Use Camera</button>' +
      '<button type="button" class="btn-edit" id="remove-photo-btn"' + (user.avatar ? '' : ' hidden') + '>Remove Photo</button>' +
      '</div>' +
      '</div>' +
      '<div class="camera-panel" id="camera-panel" hidden>' +
      '<p class="camera-error" id="camera-error" hidden></p>' +
      '<video id="camera-video" autoplay playsinline muted></video>' +
      '<div class="camera-actions">' +
      '<button type="button" class="btn-edit" id="capture-btn">Capture</button>' +
      '<button type="button" class="btn-edit" id="cancel-camera-btn">Cancel</button>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '<label class="edit-field">Bio' +
      '<textarea id="bio-input" maxlength="400" placeholder="Tell people about your account...">' + escapeHtml(user.bio) + '</textarea>' +
      '</label>' +
      '<div class="edit-field">Links <span class="link-hint">(up to 7)</span>' +
      '<div id="link-rows">' + rows.join('') + '</div>' +
      '</div>' +
      '<button type="button" class="btn-submit" id="save-profile-btn">Save Profile</button>' +
      '<p class="save-confirm" id="save-confirm" hidden>Profile saved.</p>' +
      '</div>'
    );
  }

  function render() {
    var user = tbaGetUserByUsername(viewUsername);

    if (!user) {
      content.innerHTML =
        '<div class="profile-empty">' +
        '<h1>Profile not found</h1>' +
        '<p>We couldn\'t find an account called @' + escapeHtml(viewUsername || '') + '.</p>' +
        '<p><a href="messaging.html#find">Browse Find People &rarr;</a></p>' +
        '</div>';
      return;
    }

    var isYou = !!user.isYou;
    var alreadySent = sentRequests.indexOf(user.username) !== -1;
    var bio = user.bio || '';

    var verifyStatus = isYou ? tbaGetMyVerificationStatus() : 'none';

    content.innerHTML =
      '<div class="profile-card">' +
      avatarMarkup(user, 'profile-avatar-lg') +
      '<h1 class="profile-name">' + escapeHtml(user.name) +
      (user.verified ? tbaVerifiedBadgeHtml() : '') +
      (isYou ? '<span class="you-badge">You</span>' : '') + '</h1>' +
      '<div class="profile-username">@' + escapeHtml(user.username) + '</div>' +
      '<span class="role-tag ' + user.role + '">' + (user.role === 'business' ? 'Business' : 'Influencer') + '</span>' +
      (bio
        ? '<p class="profile-bio" id="bio-display">' + escapeHtml(bio) + '</p>'
        : '<p class="profile-bio placeholder" id="bio-display">' + (isYou ? 'You haven\'t written a bio yet.' : 'This account hasn\'t written a bio yet.') + '</p>') +
      '<div id="links-display">' + renderLinks(user.links) + '</div>' +
      '<div class="profile-actions">' +
      (isYou
        ? '<button type="button" class="btn-edit" id="edit-toggle-btn">Edit Profile</button>'
        : (alreadySent
            ? '<button type="button" class="request-btn sent" disabled>Request Sent</button>'
            : '<button type="button" class="request-btn" id="request-btn">Request to Message</button>')) +
      '</div>' +
      renderNetworkSection(user) +
      renderActivitySection(user) +
      (isYou ? renderVerifySection(user, verifyStatus) : '') +
      (isYou ? renderAccountSection(user) : '') +
      (isYou ? renderEditForm(user) : '') +
      '</div>';

    if (isYou) {
      var withdrawBtn = document.getElementById('withdraw-esign-btn');
      if (withdrawBtn) {
        withdrawBtn.addEventListener('click', function () {
          tbaWithdrawESignConsent();
          render();
          tbaShowToast('E-sign consent withdrawn');
        });
      }

      var verifyForm = document.getElementById('verify-apply-form');
      if (verifyForm) {
        verifyForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var reason = document.getElementById('verify-reason-input').value.trim();
          if (!reason) return;
          tbaSubmitVerificationApplication(reason);
          render();
          tbaShowToast('Application submitted', 'success');
        });
      }

      var editForm = document.getElementById('edit-form');
      var pendingAvatar = user.avatar || '';
      var cameraStream = null;

      document.getElementById('edit-toggle-btn').addEventListener('click', function () {
        editForm.hidden = !editForm.hidden;
      });

      function setAvatarPreview(dataUrl) {
        pendingAvatar = dataUrl || '';
        var wrap = document.getElementById('avatar-preview-wrap');
        wrap.innerHTML = pendingAvatar
          ? '<img class="profile-avatar-lg" src="' + pendingAvatar + '" alt="">'
          : '<div class="profile-avatar-lg">' + initials(user.username) + '</div>';
        document.getElementById('remove-photo-btn').hidden = !pendingAvatar;
      }

      function squareCropDataUrl(source, sw, sh) {
        var size = 300;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        var side = Math.min(sw, sh);
        var sx = (sw - side) / 2;
        var sy = (sh - side) / 2;
        ctx.drawImage(source, sx, sy, side, side, 0, 0, size, size);
        return canvas.toDataURL('image/jpeg', 0.85);
      }

      document.getElementById('photo-upload').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            setAvatarPreview(squareCropDataUrl(img, img.width, img.height));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      function stopCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach(function (t) { t.stop(); });
          cameraStream = null;
        }
        document.getElementById('camera-panel').hidden = true;
      }

      document.getElementById('camera-btn').addEventListener('click', function () {
        var errorEl = document.getElementById('camera-error');
        errorEl.hidden = true;
        document.getElementById('camera-panel').hidden = false;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          errorEl.textContent = 'Camera access isn\'t supported in this browser.';
          errorEl.hidden = false;
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(function (stream) {
            cameraStream = stream;
            var video = document.getElementById('camera-video');
            video.srcObject = stream;
          })
          .catch(function () {
            errorEl.textContent = 'Camera access was denied or unavailable. You can still upload a photo instead.';
            errorEl.hidden = false;
          });
      });

      document.getElementById('capture-btn').addEventListener('click', function () {
        var video = document.getElementById('camera-video');
        if (!video.videoWidth) return;
        setAvatarPreview(squareCropDataUrl(video, video.videoWidth, video.videoHeight));
        stopCamera();
      });

      document.getElementById('cancel-camera-btn').addEventListener('click', stopCamera);

      document.getElementById('remove-photo-btn').addEventListener('click', function () {
        setAvatarPreview('');
      });

      document.getElementById('save-profile-btn').addEventListener('click', function () {
        var newBio = document.getElementById('bio-input').value.trim();
        var labelInputs = editForm.querySelectorAll('.link-label');
        var urlInputs = editForm.querySelectorAll('.link-url');
        var newLinks = [];
        for (var i = 0; i < labelInputs.length; i++) {
          var label = labelInputs[i].value.trim();
          var url = urlInputs[i].value.trim();
          if (url) {
            newLinks.push({ label: label || url, url: url });
          }
        }
        newLinks = newLinks.slice(0, 7);
        tbaSaveMyProfile(newBio, newLinks);
        tbaSaveMyProfilePic(pendingAvatar);
        stopCamera();
        document.getElementById('save-confirm').hidden = false;
        render();
        tbaShowToast('Profile saved', 'success');
      });
    } else if (!alreadySent) {
      document.getElementById('request-btn').addEventListener('click', function () {
        tbaAddSentRequest(user.username);
        sentRequests = tbaGetSentRequests();
        render();
      });
    }
  }

  render();

  // --- Easter egg: a stray "." in the footer nobody will notice is
  // actually a button. A little soccer goalkeeper game, scored, with
  // a best score remembered per account (same storage pattern as
  // everything else account-specific on this page) — a reward for
  // anyone who actually reads the fine print this closely.
  (function () {
    var dot = document.getElementById('egg-dot');
    if (!dot) return;

    var style = document.createElement('style');
    style.textContent =
      '#egg-dot { opacity: 0.4; font-size: 11px; cursor: default; user-select: none; }' +
      '.egg-overlay { position: fixed; inset: 0; z-index: 10001; background: rgba(8,16,10,0.72); display: flex; align-items: center; justify-content: center; padding: 20px; font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif; }' +
      '.egg-card { background: #fffbf3; border-radius: 22px; padding: 22px 24px 26px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,0.45); }' +
      '.egg-card h3 { margin: 0 0 4px; font-family: "Fraunces", serif; font-size: 19px; color: #2e2417; }' +
      '.egg-sub { margin: 0 0 14px; font-size: 12.5px; color: #7a6d5a; }' +
      '.egg-stage { position: relative; width: 100%; height: 320px; border-radius: 14px; overflow: hidden; background: repeating-linear-gradient(180deg, #4fa84a 0px, #4fa84a 32px, #49a044 32px, #49a044 64px); border: 3px solid #fff; cursor: none; touch-action: none; }' +
      '.egg-stage::before { content: ""; position: absolute; top: 0; left: 50%; width: 120px; height: 46px; margin-left: -60px; border: 3px solid rgba(255,255,255,0.85); border-top: none; border-radius: 0 0 6px 6px; }' +
      '.egg-bean { position: absolute; font-size: 22px; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }' +
      '.egg-basket { position: absolute; bottom: 10px; font-size: 30px; transform: translate(-50%, 0); pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }' +
      '.egg-hud { display: flex; justify-content: space-between; margin: 12px 2px 0; font-size: 12.5px; font-weight: 700; color: #2e2417; }' +
      '.egg-msg { margin: 14px 0 4px; font-size: 13.5px; color: #2e2417; min-height: 18px; }' +
      '.egg-close { margin-top: 10px; border: none; background: none; color: #7a6d5a; font-size: 12px; font-weight: 700; cursor: pointer; padding: 6px; }';
    document.head.appendChild(style);

    function highScoreKey() {
      return tbaAccountKey('tba_egg_keeper_best');
    }

    dot.addEventListener('click', function () {
      openGame();
    });

    function openGame() {
      var overlay = document.createElement('div');
      overlay.className = 'egg-overlay';
      overlay.innerHTML =
        '<div class="egg-card">' +
        '<h3>&#9917; Penalty Saves</h3>' +
        '<p class="egg-sub">Move your mouse (or finger) to dive and save the shots. 20 seconds.</p>' +
        '<div class="egg-stage" id="egg-stage"><div class="egg-basket" id="egg-basket" style="left:50%;">&#129508;</div></div>' +
        '<div class="egg-hud"><span id="egg-score">Saves: 0</span><span id="egg-time">0:20</span></div>' +
        '<p class="egg-msg" id="egg-msg"></p>' +
        '<button type="button" class="egg-close" id="egg-close">Close</button>' +
        '</div>';
      document.body.appendChild(overlay);

      var stage = overlay.querySelector('#egg-stage');
      var basket = overlay.querySelector('#egg-basket');
      var scoreEl = overlay.querySelector('#egg-score');
      var timeEl = overlay.querySelector('#egg-time');
      var msgEl = overlay.querySelector('#egg-msg');
      var score = 0;
      var basketX = 50;
      var running = true;
      var beans = [];

      function setBasketX(pct) {
        basketX = Math.max(6, Math.min(94, pct));
        basket.style.left = basketX + '%';
      }

      stage.addEventListener('mousemove', function (e) {
        var rect = stage.getBoundingClientRect();
        setBasketX(((e.clientX - rect.left) / rect.width) * 100);
      });
      stage.addEventListener('touchmove', function (e) {
        var rect = stage.getBoundingClientRect();
        var touch = e.touches[0];
        setBasketX(((touch.clientX - rect.left) / rect.width) * 100);
        e.preventDefault();
      }, { passive: false });

      function spawnBean() {
        if (!running) return;
        var bean = document.createElement('div');
        bean.className = 'egg-bean';
        bean.textContent = Math.random() < 0.15 ? '🏆' : '⚽';
        var x = 8 + Math.random() * 84;
        bean.style.left = x + '%';
        bean.style.top = '-6%';
        stage.appendChild(bean);
        beans.push({ el: bean, x: x, y: -6, speed: 1.1 + Math.random() * 1.1, bonus: bean.textContent === '🏆' });
      }

      var spawnTimer = setInterval(spawnBean, 650);

      function tick() {
        if (!running) return;
        var stageHeight = stage.clientHeight;
        for (var i = beans.length - 1; i >= 0; i--) {
          var b = beans[i];
          b.y += b.speed;
          b.el.style.top = b.y + '%';
          var pixelY = (b.y / 100) * stageHeight;
          if (pixelY > stageHeight - 38 && pixelY < stageHeight && Math.abs(b.x - basketX) < 9) {
            score += b.bonus ? 5 : 1;
            scoreEl.textContent = 'Saves: ' + score;
            b.el.remove();
            beans.splice(i, 1);
          } else if (b.y > 104) {
            b.el.remove();
            beans.splice(i, 1);
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      var secondsLeft = 20;
      var countdown = setInterval(function () {
        secondsLeft -= 1;
        timeEl.textContent = '0:' + (secondsLeft < 10 ? '0' : '') + Math.max(0, secondsLeft);
        if (secondsLeft <= 0) endGame();
      }, 1000);

      function endGame() {
        running = false;
        clearInterval(spawnTimer);
        clearInterval(countdown);
        beans.forEach(function (b) { b.el.remove(); });
        beans = [];

        var best = parseInt(localStorage.getItem(highScoreKey()) || '0', 10);
        var isNewBest = score > best;
        if (isNewBest) localStorage.setItem(highScoreKey(), String(score));
        msgEl.textContent = isNewBest
          ? 'New best: ' + score + ' saves! 🏆'
          : 'Final: ' + score + ' saves (best: ' + Math.max(best, score) + ')';
      }

      overlay.querySelector('#egg-close').addEventListener('click', function () {
        running = false;
        clearInterval(spawnTimer);
        clearInterval(countdown);
        overlay.remove();
      });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
          running = false;
          clearInterval(spawnTimer);
          clearInterval(countdown);
          overlay.remove();
        }
      });
    }
  })();
</script>
</body>
</html>
