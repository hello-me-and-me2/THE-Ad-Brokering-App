<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>if(!localStorage.getItem("tba_admin_authed")){location.replace("admin-signin.html");}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Users — Admin — THE INTROductory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/profile-picture.png">
<link rel="stylesheet" href="assets/admin.css">
<script src="assets/users-data.js"></script>
</head>
<body>

<header class="admin-header">
  <a class="brand" href="admin.html">
    <img src="assets/admin-logo.png" alt="THE INTROductory — Admin" class="brand-mark-img">
    <span class="badge">ADMIN</span>
  </a>
  <nav>
    <a href="admin.html">Overview</a>
    <a href="admin-users.html" class="active">Users</a>
    <a href="admin.html#reports">Reports</a>
    <a class="signout" href="index.html" id="signout-link">Sign Out</a>
  </nav>
</header>

<main class="admin-main">

  <a class="admin-back-link" href="admin.html">&larr; Back to Overview</a>

  <div class="admin-page-head">
    <h1>All Users</h1>
    <p>Every account on THE INTROductory — view profiles, chats, and deals.</p>
  </div>

  <div class="admin-toolbar">
    <input type="text" id="admin-user-search" class="admin-search-input" placeholder="Search by username or name..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="admin-filter-pills">
      <button type="button" class="admin-filter-pill active" data-filter="all">All</button>
      <button type="button" class="admin-filter-pill" data-filter="business">Business</button>
      <button type="button" class="admin-filter-pill" data-filter="influencer">Influencer</button>
    </div>
  </div>

  <div class="admin-user-grid" id="admin-user-grid"></div>
  <p class="admin-no-results" id="admin-no-results" hidden>No users found for that search.</p>

</main>

<script>
  document.getElementById('signout-link').addEventListener('click', function () {
    localStorage.removeItem('tba_admin_authed');
    localStorage.removeItem('tba_authed');
  });

  function initials(name) {
    return name.replace('@', '').slice(0, 2).toUpperCase();
  }

  var allUsers = tbaGetAllUsers();
  var activeFilter = 'all';
  var searchTerm = '';

  var grid = document.getElementById('admin-user-grid');
  var noResults = document.getElementById('admin-no-results');

  function render() {
    var term = searchTerm.trim().toLowerCase();
    var visible = allUsers.filter(function (u) {
      var matchesFilter = activeFilter === 'all' || u.role === activeFilter;
      var matchesSearch = term === '' ||
        u.username.toLowerCase().indexOf(term) !== -1 ||
        u.name.toLowerCase().indexOf(term) !== -1;
      return matchesFilter && matchesSearch;
    });

    grid.innerHTML = '';
    noResults.hidden = visible.length !== 0;

    visible.forEach(function (u) {
      var card = document.createElement('a');
      card.className = 'admin-user-card';
      card.href = 'admin-user.html?u=' + encodeURIComponent(u.username);

      var avatarInner = u.avatar
        ? '<img src="' + u.avatar + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
        : initials(u.username);

      var threadCount = tbaGetUserThreads(u.username).length;

      card.innerHTML =
        '<div class="admin-user-avatar">' + avatarInner + '</div>' +
        '<div>' +
        '<div class="admin-user-name-row">' +
        '<span class="admin-user-name">' + u.name + '</span>' +
        (u.isYou ? '<span class="t-tag new">You</span>' : '') +
        '</div>' +
        '<div class="admin-user-username">@' + u.username + '</div>' +
        '<span class="role-pill ' + u.role + '">' + (u.role === 'business' ? 'Business' : 'Influencer') + '</span>' +
        '</div>' +
        '<p class="admin-user-tagline">' + u.tagline + '</p>' +
        '<p class="admin-user-tagline">' + threadCount + (threadCount === 1 ? ' active thread' : ' active threads') + '</p>';

      grid.appendChild(card);
    });
  }

  document.getElementById('admin-user-search').addEventListener('input', function (e) {
    searchTerm = e.target.value;
    render();
  });

  document.querySelectorAll('.admin-filter-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      document.querySelectorAll('.admin-filter-pill').forEach(function (p) { p.classList.remove('active'); });
      pill.classList.add('active');
      activeFilter = pill.getAttribute('data-filter');
      render();
    });
  });

  render();
</script>
</body>
</html>
